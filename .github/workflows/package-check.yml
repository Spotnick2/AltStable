name: Package check

# Dry run only. Releases are built by CurseForge's own packager from the tag
# webhook, against the same .pkgmeta - this job exists so a packaging mistake
# surfaces on a pull request instead of in a published zip.
#
# -d is the real no-upload switch: merely leaving CF_API_KEY out still lets the
# packager cut a GitHub release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      # WoW runs Lua 5.1, so the tests do too - not whatever newer Lua is first
      # on PATH. tests/run.ps1 is the Windows entry point for the same files.
      - name: Syntax-check every shipped Lua file
        run: |
          luac5.1 -p *.lua Plugins/*/*.lua Libs/*/*.lua tests/*.lua

      - name: Unit tests
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      # Pinned to a SHA, not the moving v2 tag: v2 has already moved once during
      # this port (it now carries Forever support, commit 7391c8de).
      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # The zip is the artifact players install, so assert its SHAPE rather than
      # trusting .pkgmeta to have been read the way it was meant.
      - name: The package has the three addon folders, and nothing private
        run: |
          zip=$(ls .release/*.zip | head -1)
          rm -rf unpacked && mkdir unpacked && unzip -q "$zip" -d unpacked
          (cd unpacked && find . -type f | sed 's|^\./||' | sort) > files.txt

          fail=0
          for f in AltStable/AltStable.toc \
                   AltStable/Core.lua \
                   AltStable/Libs/LibDeflate/LibDeflate.lua \
                   AltStable/Media/Raids/scene-raid-mc.tga \
                   AltStable/LICENSE \
                   AltStableWarband/AltStableWarband.toc \
                   AltStableWarband/AltStableWarband.lua \
                   AltStableInstances/AltStableInstances.toc \
                   AltStableInstances/AltStableInstances.lua; do
            grep -qx "$f" files.txt || { echo "MISSING from the package: $f"; fail=1; }
          done

          # Development files must not ship. Tools/ carries the probe and the API
          # dumper; tests/ and docs/ are the working notes.
          for pat in '^AltStable/tests/' '^AltStable/Tools/' '^AltStable/docs/' \
                     '^AltStable/\.github/' '^AltStable/\.claude/' \
                     'AGENTS\.md$' 'CLAUDE\.md$' 'CHANGELOG\.md$' \
                     '^AltStable/Plugins/'; do
            if grep -qE "$pat" files.txt; then
              echo "SHOULD NOT be in the package ($pat):"
              grep -E "$pat" files.txt
              fail=1
            fi
          done

          # @project-version@ must have been substituted in every TOC, and no
          # literal version may have been committed over the keyword.
          for toc in $(grep -E '\.toc$' files.txt); do
            v=$(grep -i '^## Version:' "unpacked/$toc" | head -1)
            echo "$toc  ->  $v"
            case "$v" in
              *"@project-version@"*) echo "  keyword not substituted"; fail=1 ;;
              *dev*)                 echo "  a dev version was committed over the keyword"; fail=1 ;;
            esac
          done

          exit $fail

      # .release is hidden, and upload-artifact@v4 skips hidden content unless
      # told otherwise - without this the upload silently finds nothing and the
      # job stays green while proving nothing.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: altstable-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
