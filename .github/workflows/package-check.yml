name: Package check

# The packager runs as a dry run here. CurseForge builds its releases with its
# own packager from the tag webhook, against the same .pkgmeta - `check` exists
# so a packaging mistake surfaces on a pull request instead of in a published
# zip.
#
# -d is the real no-upload switch: merely leaving CF_API_KEY out still lets the
# packager cut a GitHub release - with the WHOLE CHANGELOG.md as its notes.
#
# On a tag, once `check` has passed, the zip it built and checked is published
# twice more, never rebuilt: `release` makes the GitHub Release (#209, with
# release.json), `wago` uploads to Wago Addons. The packager stays out of both.
# The release-files step and both publishing jobs are the shared template
# (References\Docs\release\package-check.yml, RELEASING.md §2), unchanged.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Publish an existing tag again where it failed. Run it from main: `check`
  # builds the tag's tree, notes included. Only tags from v0.11.0 on pass
  # `check`, and only tags from v0.15.0 on (the TOC's X-Wago-ID) pass `wago`.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.15.0)
        required: true
      publish:
        description: Where to publish it
        type: choice
        options: [both, github, wago]
        default: both

permissions:
  contents: read

env:
  ADDON: AltStable

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Empty except on a manual run, so checkout keeps its default: the
          # commit that triggered the run (a branch ref would build its tip).
          ref: ${{ inputs.tag }}

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      # The embedded LibGlass-1.0 at the ref .pkgmeta pins (read from there,
      # never written twice), checked to BE that commit (#184). The tests load
      # it from $LIBGLASS; the packager fetches the same pin into
      # Libs/LibGlass-1.0. Outside the checkout, so the syntax check below
      # stays on our own files: the library is checked in its repo.
      - name: Fetch LibGlass at the pinned ref
        run: |
          bash tests/fetch_libglass.sh "$RUNNER_TEMP/LibGlass"
          echo "LIBGLASS=$RUNNER_TEMP/LibGlass" >> "$GITHUB_ENV"

      # The embedded LibShowcase-1.0 (the camera showcase), the same way.
      - name: Fetch LibShowcase at the pinned ref
        run: |
          bash tests/fetch_libshowcase.sh "$RUNNER_TEMP/LibShowcase"
          echo "LIBSHOWCASE=$RUNNER_TEMP/LibShowcase" >> "$GITHUB_ENV"

      # The embedded LibAccountSync-1.0 (the own-account sync), the same way.
      - name: Fetch LibAccountSync at the pinned ref
        run: |
          bash tests/fetch_libaccountsync.sh "$RUNNER_TEMP/LibAccountSync"
          echo "LIBACCOUNTSYNC=$RUNNER_TEMP/LibAccountSync" >> "$GITHUB_ENV"

      # WoW runs Lua 5.1, so the tests do too - not whatever newer Lua is first
      # on PATH. tests/run.ps1 is the Windows entry point for the same files.
      #
      # find, not globs: a glob only reaches one nesting level, so a library at
      # Libs/Foo/Bar/Baz.lua would ship unchecked - and with nullglob off, a
      # pattern matching nothing is passed through literally and fails the job
      # for the wrong reason.
      - name: Syntax-check every shipped Lua file
        run: |
          count=$(find . -name '*.lua' -not -path './.git/*' | wc -l)
          test "$count" -gt 0 || { echo "no Lua files found - the check would prove nothing"; exit 1; }
          echo "checking $count files"
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 luac5.1 -p

      - name: Unit tests
        env:
          # ForeverProbe is private and local, so the probe's tests
          # (test_probe, test_whaticon) skip here and run locally (#240).
          FOREVERPROBE_OPTIONAL: "1"
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      # The recipe generator's parsing, on saved fixtures - never the network.
      # (test_cutouts.py is left to local runs: it needs Pillow.)
      - name: Recipe data generator tests
        run: python3 tests/test_recipedata.py

      # The cutout manifest writer's enhanced-texture attachment rule, on temp
      # files (no Python, no client).
      - name: Update-Cutouts attachment rule
        shell: pwsh
        run: ./Tools/RenderCutout/Update-Cutouts.ps1 -SelfTest

      # On a manual run GITHUB_REF is main, and the packager names the build
      # after whichever tag at HEAD it sorts first (release.sh 613-628 prefers
      # GITHUB_REF_NAME only on a tag push). An alpha promoted to a release
      # without a code change puts two tags on one commit, so drop the others
      # from this checkout: the zip and its TOC version are the requested tag's.
      - name: Only the requested tag at HEAD
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for t in $(git tag --points-at HEAD); do
            [ "$t" = "$TAG" ] || git tag -d "$t"
          done
          test "$(git tag --points-at HEAD)" = "$TAG" || { echo "$TAG is not at HEAD"; exit 1; }

      # Pinned to a SHA, not the moving v2 tag: v2 has already moved once during
      # this port (it now carries Forever support, commit 7391c8de).
      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # The zip is the artifact players install, so assert its SHAPE rather than
      # trusting .pkgmeta to have been read the way it was meant.
      - name: The package has every addon folder, and nothing private
        run: |
          zip=$(ls .release/*.zip | head -1)
          rm -rf unpacked && mkdir unpacked && unzip -q "$zip" -d unpacked
          (cd unpacked && find . -type f | sed 's|^\./||' | sort) > files.txt

          fail=0

          # Every addon folder the packager is expected to produce. The TOC
          # count below is derived from this list rather than written out as a
          # number: this check hardcoded "3" and a fourth addon made it fail for
          # being right.
          addons="AltStable AltStableWarband AltStableInstances AltStableRoster AltStableProfessions"

          for f in AltStable/AltStable.toc \
                   AltStable/Core.lua \
                   AltStable/Bindings.xml \
                   AltStable/Libs/LibDeflate/LibDeflate.lua \
                   AltStable/Media/Raids/scene-raid-mc.tga \
                   AltStable/LICENSE \
                   AltStableWarband/AltStableWarband.toc \
                   AltStableWarband/AltStableWarband.lua \
                   AltStableInstances/AltStableInstances.toc \
                   AltStableInstances/AltStableInstances.lua \
                   AltStableRoster/AltStableRoster.toc \
                   AltStableRoster/AltStableRoster.lua \
                   AltStableProfessions/AltStableProfessions.toc \
                   AltStableProfessions/AltStableProfessions.lua \
                   AltStableProfessions/RecipeData.lua; do
            grep -qx "$f" files.txt || { echo "MISSING from the package: $f"; fail=1; }
          done

          # The scene backdrops are the point of the Roster's scene view and are
          # the largest thing in the download, so assert BOTH halves of that
          # bargain: the textures ship, and the documentation beside them does
          # not. A .pkgmeta ignore entry that stops matching is silent.
          scenes=$(grep -cE '^AltStable/Media/Scene/scene-.*\.tga$' files.txt || true)
          test "$scenes" -eq 14 || { echo "expected 14 scene backdrops, found $scenes"; fail=1; }
          if grep -qE '^AltStable/Media/Scene/.*\.(md|png)$' files.txt; then
            echo "scene documentation or masters should not ship:"
            grep -E '^AltStable/Media/Scene/.*\.(md|png)$' files.txt
            fail=1
          fi

          # Development files must not ship. Tools/ carries the probe and the API
          # dumper; tests/ and docs/ are the working notes.
          for pat in '^AltStable/tests/' '^AltStable/Tools/' '^AltStable/docs/' \
                     '^AltStable/\.github/' '^AltStable/\.claude/' \
                     'AGENTS\.md$' 'CLAUDE\.md$' 'CHANGELOG\.md$' \
                     '^AltStable/Plugins/' '^AltStable/Media/Glass/'; do
            if grep -qE "$pat" files.txt; then
              echo "SHOULD NOT be in the package ($pat):"
              grep -E "$pat" files.txt
              fail=1
            fi
          done

          # @project-version@ must have been substituted in every TOC, and no
          # literal version may have been committed over the keyword.
          #
          # The count is asserted first: a zero-iteration loop is not an error
          # under `bash -e`, so a package whose TOC layout changed would sail
          # through this having proved nothing.
          want=$(echo $addons | wc -w)
          tocs=$(grep -cE '\.toc$' files.txt || true)
          test "$tocs" -eq "$want" || { echo "expected $want TOCs in the package, found $tocs"; fail=1; }
          for toc in $(grep -E '\.toc$' files.txt); do
            v=$(grep -i '^## Version:' "unpacked/$toc" | head -1)
            echo "$toc  ->  $v"
            case "$v" in
              "")                    echo "  no Version line at all"; fail=1 ;;
              *"@project-version@"*) echo "  keyword not substituted"; fail=1 ;;
              *dev*)                 echo "  a dev version was committed over the keyword"; fail=1 ;;
            esac
          done

          exit $fail

      # Under Libs/LibGlass-1.0, EXACTLY what the library ships (#184): its
      # XML, every file the XML loads, LICENSE, Media/*.tga - nothing else.
      # This dry run is the BigWigs packager, which DOES honour the library's
      # own .pkgmeta ignores; CurseForge's does not. So a missing
      # Libs/LibGlass-1.0/... entry in OUR .pkgmeta cannot show here:
      # tests/test_packaging.lua checks those entries against the library's list.
      - name: The package embeds exactly the library
        run: |
          lib=AltStable/Libs/LibGlass-1.0
          {
            echo "$lib/LibGlass-1.0.xml"
            echo "$lib/LICENSE"
            # Comments stripped non-greedily, as tests/libglass.lua does.
            tr -d '\r' < "$LIBGLASS/LibGlass-1.0.xml" | perl -0pe 's/<!--.*?-->//gs' |
              sed -n 's/.*<Script file="\([^"]*\)".*/\1/p' | tr '\\' '/' | sed "s|^|$lib/|"
            (cd "$LIBGLASS" && ls Media/*.tga) | sed "s|^|$lib/|"
          } | sort > expected.txt
          grep "^$lib/" files.txt | sort > actual.txt
          echo "library files expected: $(wc -l < expected.txt) ($(grep -c "^$lib/Media/" expected.txt) textures)"
          if ! diff -u expected.txt actual.txt; then
            echo "the embedded library differs from what it ships (- missing, + extra)"
            exit 1
          fi

      # The packager fetched its own copy; prove it is the pinned commit's
      # content (the files the tests ran against). Its text filter rewrites
      # .lua/.xml with CRLF, so those compare with CRs stripped; textures and
      # LICENSE byte for byte.
      - name: The packaged library is the pinned commit
        run: |
          lib=unpacked/AltStable/Libs/LibGlass-1.0
          bad=0
          while read -r f; do
            case "$f" in
              *.lua|*.xml) cmp -s <(tr -d '\r' < "$lib/$f") <(tr -d '\r' < "$LIBGLASS/$f") ;;
              *) cmp -s "$lib/$f" "$LIBGLASS/$f" ;;
            esac || { echo "differs from the pinned checkout: $f"; bad=1; }
          done < <(cd "$lib" && find . -type f | sed 's|^\./||')
          test "$bad" -eq 0

      # LibShowcase-1.0: exactly its XML, every file the XML loads and LICENSE
      # (it has no media), and each one the pinned commit's content.
      - name: The package embeds exactly LibShowcase, at the pin
        run: |
          lib=AltStable/Libs/LibShowcase-1.0
          {
            echo "$lib/LibShowcase-1.0.xml"
            echo "$lib/LICENSE"
            tr -d '\r' < "$LIBSHOWCASE/LibShowcase-1.0.xml" | perl -0pe 's/<!--.*?-->//gs' |
              sed -n 's/.*<Script file="\([^"]*\)".*/\1/p' | tr '\\' '/' | sed "s|^|$lib/|"
          } | sort > expected-showcase.txt
          grep "^$lib/" files.txt | sort > actual-showcase.txt
          if ! diff -u expected-showcase.txt actual-showcase.txt; then
            echo "the embedded LibShowcase differs from what it ships (- missing, + extra)"
            exit 1
          fi
          bad=0
          while read -r f; do
            case "$f" in
              *.lua|*.xml) cmp -s <(tr -d '\r' < "unpacked/$lib/$f") <(tr -d '\r' < "$LIBSHOWCASE/$f") ;;
              *) cmp -s "unpacked/$lib/$f" "$LIBSHOWCASE/$f" ;;
            esac || { echo "differs from the pinned checkout: $f"; bad=1; }
          done < <(cd "unpacked/$lib" && find . -type f | sed 's|^\./||')
          test "$bad" -eq 0

      # LibAccountSync-1.0: exactly its XML, every file the XML loads (its
      # bundled LibStub and ChatThrottleLib among them) and LICENSE, each one
      # the pinned commit's content.
      - name: The package embeds exactly LibAccountSync, at the pin
        run: |
          lib=AltStable/Libs/LibAccountSync-1.0
          {
            echo "$lib/LibAccountSync-1.0.xml"
            echo "$lib/LICENSE"
            tr -d '\r' < "$LIBACCOUNTSYNC/LibAccountSync-1.0.xml" | perl -0pe 's/<!--.*?-->//gs' |
              sed -n 's/.*<Script file="\([^"]*\)".*/\1/p' | tr '\\' '/' | sed "s|^|$lib/|"
          } | sort > expected-accountsync.txt
          grep "^$lib/" files.txt | sort > actual-accountsync.txt
          if ! diff -u expected-accountsync.txt actual-accountsync.txt; then
            echo "the embedded LibAccountSync differs from what it ships (- missing, + extra)"
            exit 1
          fi
          bad=0
          while read -r f; do
            case "$f" in
              *.lua|*.xml) cmp -s <(tr -d '\r' < "unpacked/$lib/$f") <(tr -d '\r' < "$LIBACCOUNTSYNC/$f") ;;
              *) cmp -s "unpacked/$lib/$f" "$LIBACCOUNTSYNC/$f" ;;
            esac || { echo "differs from the pinned checkout: $f"; bad=1; }
          done < <(cd "unpacked/$lib" && find . -type f | sed 's|^\./||')
          test "$bad" -eq 0

      # What a tag publishes next to the zip, from the tag's own CHANGELOG.md,
      # built on every run so a changelog heading or TOC field that breaks it
      # fails on the pull request. Off a tag there is no tag section, so it
      # reads the newest one. `release` and `wago` publish these very files.
      # The script is the workflow's own (GITHUB_SHA), not the checked-out
      # tree's: a manual run checks out the requested tag, and a tag from
      # before the script has none (Codex, NodeRadar #36).
      - name: The release notes and release.json build
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          zip=$(ls .release/*.zip | head -1)
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(tr -d '\r' < CHANGELOG.md | sed -n 's/^## \(v[^ ]*\).*/\1/p' | head -1)
          fi
          git show "$GITHUB_SHA:tests/release_files.sh" > "$RUNNER_TEMP/release_files.sh"
          bash "$RUNNER_TEMP/release_files.sh" "$tag" "$zip" "$RUNNER_TEMP/release-files"

      # .release is a hidden directory, and upload-artifact@v4 skips hidden
      # content by default - without include-hidden-files the upload finds
      # nothing. `warn` then leaves the job green while publishing no artifact.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

      - name: Keep the notes and release.json for the publishers
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error

  # A GitHub Release for every tag: the zip `check` built and checked,
  # release.json, and the tag's CHANGELOG.md section as the notes. The only job
  # allowed to write to the repository.
  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'wago')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Everything comes from `check`'s artifacts - the zip, and the notes and
      # release.json it built from the tag's tree - so there is no checkout:
      # on a manual run from main, one would read main's CHANGELOG.md.
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: The zip and release.json are the tag's
        run: |
          ls dist out
          zip="dist/$ADDON-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null ||
            { echo "release.json is not $TAG's:"; cat out/release.json; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # The title is release.json's name: the packaged TOC's Title, colour
      # codes stripped.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "${TAG,,}" in *alpha*|*beta*) pre=--prerelease ;; esac
          title="$(jq -r '.releases[0].name' out/release.json) ${TAG#v}"
          gh release create "$TAG" "$ZIP" out/release.json --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" --notes-file out/notes.md $pre

  # The same zip on Wago Addons, through its upload API - the request the
  # packager's upload_wago makes, minus its two problems: it would package a
  # second, unchecked zip, and send the whole CHANGELOG.md as the changelog.
  # Only this job sees WAGO_API_TOKEN.
  wago:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'github')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # As in `release`: `check`'s artifacts only, no checkout.
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: The zip and release.json are the tag's
        run: |
          zip="dist/$ADDON-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null ||
            { echo "release.json is not $TAG's:"; cat out/release.json; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # The project is the packaged TOC's X-Wago-ID. Each interface becomes the
      # patch Wago names it by (16001 -> 1.60.1), which must be one Wago lists
      # for Forever: the packager would fall back to a neighbouring patch, but a
      # new client build Wago doesn't know yet should stop here instead. Run the
      # tag again (workflow_dispatch, wago) once Wago lists it.
      - name: The Wago upload metadata
        run: |
          id=$(unzip -p "$ZIP" "$ADDON/$ADDON.toc" | tr -d '\r' | sed -n 's/^## X-Wago-ID: *//p' | head -1)
          test -n "$id" || { echo "the packaged TOC has no X-Wago-ID"; exit 1; }
          echo "WAGO_ID=$id" >> "$GITHUB_ENV"
          known=$(curl -sS --fail --retry 3 https://addons.wago.io/api/data/game | jq -c '.patches.forever // []')
          echo "Wago's Forever patches: $known"
          patches=()
          for i in $(jq -r '.releases[0].metadata[].interface' out/release.json); do
            p=$(printf '%d.%d.%d' $((i / 10000)) $((i / 100 % 100)) $((i % 100)))
            jq -e --arg p "$p" 'index($p) != null' <<< "$known" > /dev/null ||
              { echo "Wago lists no Forever patch $p (interface $i)"; exit 1; }
            patches+=("$p")
          done
          case "${TAG,,}" in *alpha*) stability=alpha ;; *beta*) stability=beta ;; *) stability=stable ;; esac
          jq -n --arg label "$TAG" --arg stability "$stability" --rawfile changelog out/notes.md \
            --argjson patches "$(printf '%s\n' "${patches[@]}" | jq -R . | jq -s .)" \
            '{label: $label, stability: $stability, changelog: $changelog,
              supported_forever_patches: $patches}' > out/metadata.json
          cat out/metadata.json

      - name: Upload to Wago Addons
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          test -n "$WAGO_API_TOKEN" || { echo "the WAGO_API_TOKEN secret is not set"; exit 1; }
          code=$(curl -sS --retry 3 --retry-delay 10 -o out/result.json -w '%{http_code}' \
            -H "authorization: Bearer $WAGO_API_TOKEN" \
            -H 'accept: application/json' \
            -F 'metadata=<out/metadata.json' \
            -F "file=@$ZIP" \
            "https://addons.wago.io/api/projects/$WAGO_ID/version")
          echo "HTTP $code"
          case "$code" in
            200|201) echo "uploaded: https://addons.wago.io/addons/$WAGO_ID" ;;
            *) cat out/result.json 2>/dev/null; exit 1 ;;
          esac
